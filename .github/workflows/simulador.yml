name: Simulador de Tráfico Real Multilocalización

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas todos los días
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  simular-visita:
    runs-on: ubuntu-latest
    steps:
    - name: Configurar Entorno Virtual
      run: |
        sudo apt-get update
        sudo apt-get install -y curl

    - name: Simular Usuarios de Diferentes Países
      run: |
        USER_AGENT="Mozilla/5.0 (Linux; Android 10; SM-G973F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
        
        # Lista de proxies públicos y gratuitos de diferentes países (España, UK, Francia, Alemania, etc.)
        # Estos servidores enmascaran la IP de GitHub simulando accesos locales
        PROXIES=(
          "http://185.242.107.130:80"   # Europa / España
          "http://45.132.227.189:80"    # Europa Central
          "http://178.62.193.19:8080"   # UK / Londres
          "http://80.48.119.28:8080"    # Europa del Este
        )

        # Elegir un proxy al azar para esta sesión de juego
        PROXY_ELEGIDO=${PROXIES[$(( RANDOM % 4 ))]}
        echo "Simulando acceso de usuario a través del servidor local: $PROXY_ELEGIDO"

        # 1. Entrada a la Home simulando la localización elegida
        curl -s -x "$PROXY_ELEGIDO" -A "$USER_AGENT" https://dadoparchis.com > /dev/null || curl -s -A "$USER_AGENT" https://dadoparchis.com > /dev/null
        
        # Espera aleatoria humana
        sleep $(( RANDOM % 4 + 2 ))

        # 2. Número de clics aleatorio (7, 12, 14 o 22)
        OPCIONES_CLICS=(7 12 14 22)
        TOTAL_CLICS=${OPCIONES_CLICS[$(( RANDOM % 4 ))]}
        echo "El usuario de esta localización va a tirar el dado $TOTAL_CLICS veces."

        # 3. Simulación de las tiradas con tiempos aleatorios (1 a 4 seg)
        for (( i=1; i<=TOTAL_CLICS; i++ ))
        do
          TIEMPO_ESPERA=$(( RANDOM % 4 + 1 ))
          echo "Tirada $i de $TOTAL_CLICS desde IP enmascarada... Esperando $TIEMPO_ESPERA segundos."
          
          # Lanza la petición usando el proxy para cambiar la ubicación del clic
          curl -s -x "$PROXY_ELEGIDO" -A "$USER_AGENT" "https://dadoparchis.com/?click=$i&rand=$RANDOM" > /dev/null || curl -s -A "$USER_AGENT" "https://dadoparchis.com/?click=$i&rand=$RANDOM" > /dev/null
          
          sleep $TIEMPO_ESPERA
        done

        # 4. Probabilidad del 50% de mirar la privacidad
        if [ $(( RANDOM % 2 )) -eq 1 ]; then
          echo "El usuario revisa la privacidad antes de salir..."
          sleep $(( RANDOM % 3 + 1 ))
          curl -s -x "$PROXY_ELEGIDO" -A "$USER_AGENT" https://dadoparchis.com/privacidad.html > /dev/null || curl -s -A "$USER_AGENT" https://dadoparchis.com/privacidad.html > /dev/null
        fi

        echo "Simulación internacional completada."
